name: Build and test Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and search behavior
        run: npm test
      - name: Verify reproducible catalog
        run: |
          python3 scripts/build-catalog.py
          git diff --exit-code -- dist/catalog.json data/catalog-audit.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and lint
        run: gradle :android:app:assembleRelease :android:app:assembleDebug :android:app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ford-Parts-Desk-unsigned-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Ford-Parts-Desk-debug-test-only
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android catalog and guided lookup tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/

