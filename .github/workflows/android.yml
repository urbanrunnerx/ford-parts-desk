name: Build and test Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate catalog and search behavior
        run: npm test
      - name: Test release validation guards
        run: python3 tests/release_metadata_test.py
      - name: Verify reproducible catalog
        run: |
          python3 scripts/build-catalog.py
          git diff --exit-code -- dist/catalog.json data/catalog-audit.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Build and lint
        run: gradle :android:app:assembleRelease :android:app:assembleDebug :android:app:lintRelease :android:app:lintDebug --no-daemon
      - name: Exercise signing with a disposable test key
        run: |
          sdkmanager 'build-tools;35.0.0'
          python3 tests/release_signing_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ford-Parts-Desk-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ford-Parts-Desk-debug-test-only
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android catalog and guided lookup tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
