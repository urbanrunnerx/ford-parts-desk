name: Publish signed Android release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Serialize releases, including different tags; never interrupt signing/upload.
concurrency:
  group: android-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.repository == 'urbanrunnerx/ford-parts-desk' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a new version from main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 .github/scripts/release-metadata.py source "$RELEASE_TAG" "$RUNNER_TEMP/releases.json"

  build:
    needs: validate
    uses: ./.github/workflows/android.yml
    # Deliberately no secrets: inherit. Tests/build cannot access the release key.

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install fixed signing tools before loading secrets
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Name + default current run scope: never reuse another run's APK.
          name: Ford-Parts-Desk-unsigned-release
          path: release-input
      - name: Sign only the release APK and verify its identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/sign-release.sh
      - name: Transfer only verified public deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ford-Parts-Desk-verified-release
          path: |
            release-output/Ford-Parts-Desk.apk
            release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            android/app
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Ford-Parts-Desk-verified-release
          path: release-output
      - name: Independently verify downloaded APK and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/verify-release.sh release-output/Ford-Parts-Desk.apk
          cd release-output
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test -f SHA256SUMS.txt && test ! -L SHA256SUMS.txt
          sha256sum Ford-Parts-Desk.apk | cmp - SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
      - name: Upload to a draft, check uploaded bytes, then publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh
